# ====================================================================
# 🤖 AI 부대 단독 명세서 (Buddham.Ai - gRPC 전용 내부망)
# ------------------------------------------------------------------
# 필요한 비밀은 Postgres 연결 문자열뿐이라 buddham-postgres-secret 만 사용합니다.
# (buddham-app-secret 은 의도적으로 주입하지 않음 → 최소 권한)
# ====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buddham-ai-deploy
  namespace: buddham
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buddham-ai
  template:
    metadata:
      labels:
        app: buddham-ai
    spec:
      containers:
        - name: buddham-ai-container
          image: buddham-ai:net10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: 'Production'

            # --- Ollama ---
            - name: Ollama__BaseUrl
              value: 'http://192.168.0.8:11434'
            - name: Ollama__Model
              value: 'bge-m3:latest'
            - name: OllamaChat__BaseUrl
              value: 'http://192.168.0.8:11434'
            - name: OllamaChat__Model
              value: 'dhamma-chat:latest'
            # --- JWT (공유 확장 코드의 옵션 검증 통과용) ---
            - name: JwtConfig__Key
              valueFrom:
                secretKeyRef:
                  name: buddham-app-secret
                  key: JwtConfig__Key
            - name: JwtConfig__Issuer
              valueFrom:
                secretKeyRef:
                  name: buddham-app-secret
                  key: JwtConfig__Issuer
            - name: JwtConfig__Audience
              valueFrom:
                secretKeyRef:
                  name: buddham-app-secret
                  key: JwtConfig__Audience
            - name: JwtConfig__AccessTokenIn
              valueFrom:
                secretKeyRef:
                  name: buddham-app-secret
                  key: JwtConfig__AccessTokenIn
            - name: JwtConfig__RefreshTokenIn
              valueFrom:
                secretKeyRef:
                  name: buddham-app-secret
                  key: JwtConfig__RefreshTokenIn
            # --- 연결 문자열 ---
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: buddham-postgres-secret
                  key: DefaultConnection
            - name: ConnectionStrings__RedisConnection
              value: 'buddham-redis-svc:6379,abortConnect=false'

          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: buddham-ai-svc
  namespace: buddham
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
  selector:
    app: buddham-ai
