apiVersion: v1
kind: Service
metadata:
  name: buddham-api-svc
  namespace: buddham
spec:
  type: NodePort
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31380
  selector:
    app: buddham-api
