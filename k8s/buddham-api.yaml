# ==========================================
# 2️⃣ 웹 비즈니스 본진 (Buddham.Api)
# ------------------------------------------
# 비밀 값은 모두 Secret 에서 주입합니다.
#   - buddham-app-secret    : JWT, 관리자 계정 등 (envFrom 으로 일괄 주입)
#   - vivabm-data-secret    : 중앙 DB 마스터 시크릿 (vivabm-data 네임스페이스에서 공수)
#   - buddham-email-secret  : 메일 비밀번호
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buddham-api-deploy
  namespace: buddham
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buddham-api
  template:
    metadata:
      labels:
        app: buddham-api
    spec:
      containers:
        - name: buddham-api-container
          image: kimbumjun/buddham-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          # Secret 의 모든 키가 그대로 환경변수 이름이 됩니다.
          envFrom:
            - secretRef:
                name: buddham-app-secret
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: 'Production'
            - name: ASPNETCORE_HTTP_PORTS
              value: '8080'

            # --- 중앙 DB 시크릿(vivabm-data-secret)에서 비밀번호를 안전하게 추출하여 연결 문자열 조립 ---
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vivabm-data-secret
                  namespace: vivabm-data
                  key: BUDDHAM_MASTER_PASSWORD

            - name: ConnectionStrings__DefaultConnection
              value: 'Host=postgres-svc.vivabm-data.svc.cluster.local;Port=5432;Database=buddham;Username=buddham;Password=$(DB_PASSWORD);SSL Mode=Prefer;Trust Server Certificate=true;Pooling=true;Maximum Pool Size=50;'

            - name: ConnectionStrings__RedisConnection
              value: 'buddham-redis-svc:6379,abortConnect=false'

            - name: Ollama__BaseUrl
              value: 'http://192.168.0.8:11434'
            - name: Ollama__Model
              value: 'bge-m3:latest'

            # --- 이메일 ---
            - name: EmailConfig__From
              value: 'viv.buddha@gmail.com'
            - name: EmailConfig__FromName
              value: '정토사경'
            - name: EmailConfig__Host
              value: 'smtp.gmail.com'
            - name: EmailConfig__Port
              value: '587'
            - name: EmailConfig__Password
              valueFrom:
                secretKeyRef:
                  name: buddham-email-secret
                  key: Password

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
          volumeMounts:
            - name: api-storage
              mountPath: /app/Storage
      volumes:
        - name: api-storage
          hostPath:
            path: /home/dharma/Kubs/Buddham/Storage
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: buddham-api-svc
  namespace: buddham
spec:
  type: NodePort
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31380
  selector:
    app: buddham-api
