# ======================================================
# 💬 실시간 소통 특공대 단독 명세서 (Buddham.Chat - SignalR)
# ------------------------------------------------------
# SignalR 허브에서 API 가 발급한 JWT 를 검증한다면 같은 JwtConfig 값이 필요합니다.
# 필요한 키만 골라서 주입합니다 (envFrom 으로 전체를 주지 않음 → 최소 권한).
# 채팅 서버가 JWT 를 검증하지 않는다면 JwtConfig__* 5개 항목은 삭제하세요.
# ======================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buddham-chat-deploy
  namespace: buddham
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buddham-chat
  template:
    metadata:
      labels:
        app: buddham-chat
    spec:
      containers:
        - name: buddham-chat-container
          image: buddham-chat:net10
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: 'Production'
            - name: ASPNETCORE_HTTP_PORTS
              value: '8080'
            - name: ConnectionStrings__RedisConnection
              value: 'buddham-redis-svc:6379'
            - name: GrpcServices__AiService
              value: 'http://buddham-ai-svc:50051'

            # --- JWT (API 와 동일한 값이어야 토큰 검증 가능) ---
            - name: JwtConfig__Key
              valueFrom:
                secretKeyRef:
                  name: buddham-app-secret
                  key: JwtConfig__Key
            - name: JwtConfig__Issuer
              valueFrom:
                secretKeyRef:
                  name: buddham-app-secret
                  key: JwtConfig__Issuer
            - name: JwtConfig__Audience
              valueFrom:
                secretKeyRef:
                  name: buddham-app-secret
                  key: JwtConfig__Audience
            - name: JwtConfig__AccessTokenIn
              valueFrom:
                secretKeyRef:
                  name: buddham-app-secret
                  key: JwtConfig__AccessTokenIn
            - name: JwtConfig__RefreshTokenIn
              valueFrom:
                secretKeyRef:
                  name: buddham-app-secret
                  key: JwtConfig__RefreshTokenIn

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: buddham-chat-svc
  namespace: buddham
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 31381
  selector:
    app: buddham-chat
