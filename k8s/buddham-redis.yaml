# buddham-redis.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buddham-redis
  namespace: buddham
spec:
  serviceName: buddham-redis-svc
  replicas: 1
  selector:
    matchLabels:
      app: buddham-redis
  template:
    metadata:
      labels:
        app: buddham-redis
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          command: ['redis-server', '--appendonly', 'yes']
          volumeMounts:
            - name: buddham-redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: buddham-redis-data
        labels:
          app: buddham-redis
      spec:
        accessModes: ['ReadWriteOnce']
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: buddham-redis-svc
  namespace: buddham
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: buddham-redis
