syntax = "proto3";

option csharp_namespace = "Buddham.Shared.Protos";

package ai;

// AI 연산 담당 서비스 정의
service AiEngine {
  // 사용자가 화두를 던지면, AI가 글자를 스트리밍(stream)으로 타다닥 뱉어냄!
  rpc AskStream (AiRequest) returns (stream AiResponse);
}

// 요청 데이터 주머니
message AiRequest {
  string prompt = 1;
  string user_id = 2;
  repeated ProtoChatMessage history = 3; // 히스토리
}

message ProtoChatMessage {
  string role = 1;
  string content = 2;
}
enum ResponseType {
  RESPONSE_TYPE_UNSPECIFIED = 0;  // proto3 규칙: enum 0번은 항상 UNSPECIFIED/UNKNOWN으로 예약
  TOKEN = 1;
  THINKING = 2;
  DONE = 3;
  ERROR = 4;
}
// 응답 데이터 주머니
message AiResponse {
  string type = 1;   // "token" | "thinking" | "done"
  string data = 2;   // 실제 내용
  string error_code = 3;
}
